# Asks every new contributor to sign CLA.md once, by posting a comment on their pull request.
# Signatures are stored in signatures/cla.json on the "cla-signatures" branch, so main stays clean.
# Uses CLA Assistant Lite: https://github.com/contributor-assistant/github-action
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/CyberLav/Cyber_Battle_Pro/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          # The maintainer and bots do not need to sign
          allowlist: CyberLav,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: 'Thanks for your contribution. Before it can be merged, please read the [Contributor License Agreement](https://github.com/CyberLav/Cyber_Battle_Pro/blob/main/CLA.md) and sign it by posting the sentence below as a comment. You only do this once.'
          lock-pullrequest-aftermerge: false
